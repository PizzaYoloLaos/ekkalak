<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ekkalak — Tools v3</title>
<meta name="theme-color" content="#2e2b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ekkalak">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#2e2b2b; --card:#383434; --card2:#413c3c;
  --gold:#f2ece0; --gold2:#f2ece0; --txt:#f2ece0; --mut:#a89f93; --line:#4a4544;
  --home:#c96f4a; --py:#d94f3d;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(120% 80% at 50% 0%,#353130 0%,var(--bg) 60%);color:var(--txt);
  min-height:100vh;padding:calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom))}
.wrap{max-width:440px;margin:0 auto}
.top{text-align:center;margin-bottom:30px}
.logo-img{width:100%;max-width:300px;height:auto;display:inline-block}
.tagline{font-family:Georgia,serif;font-style:italic;font-size:13px;color:var(--gold2);margin-top:16px;opacity:.75}
.biz{margin-bottom:26px}
.biz-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.biz-dot{width:10px;height:10px;border-radius:50%}
.biz-name{font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.biz-line{flex:1;height:1px;background:var(--line)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
a.tool{display:flex;flex-direction:column;align-items:center;gap:9px;text-decoration:none;color:var(--txt);
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 6px 15px;
  transition:transform .1s, border-color .15s}
a.tool:active{transform:scale(.96);border-color:var(--gold);background:var(--card2)}
.tool svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool .t{font-size:12.5px;font-weight:600;letter-spacing:.3px}
footer{text-align:center;margin-top:34px;font-size:10px;color:var(--mut);letter-spacing:1px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <img class="logo-img" src="logo.png" alt="Ekkalak Hospitality Creators">
    <div class="tagline">Crafting Exceptional Hospitality Experiences</div>
  </div>

  <div class="biz">
    <div class="biz-head">
      <span class="biz-dot" style="background:var(--home)"></span>
      <span class="biz-name">HOME Restaurant</span>
      <span class="biz-line"></span>
    </div>
    <div class="tools">
      <a class="tool" href="https://sales.home-vte.com">
        <svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/></svg>
        <span class="t">Sales</span></a>
      <a class="tool" href="https://expenses.home-vte.com">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>
        <span class="t">Expenses</span></a>
      <a class="tool" href="https://pnl.home-vte.com">
        <svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M17 8c0-2-2.2-3-5-3s-5 1-5 3 2 2.7 5 3c3 .3 5 1 5 3s-2.2 3-5 3-5-1-5-3"/></svg>
        <span class="t">P&amp;L</span></a>
    </div>
  </div>

  <div class="biz">
    <div class="biz-head">
      <span class="biz-dot" style="background:var(--py)"></span>
      <span class="biz-name">PizzaYolo</span>
      <span class="biz-line"></span>
    </div>
    <div class="tools">
      <a class="tool" href="https://sales.pizzayolo.la">
        <svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/></svg>
        <span class="t">Sales</span></a>
      <a class="tool" href="https://expenses.pizzayolo.la">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>
        <span class="t">Expenses</span></a>
      <a class="tool" href="https://pnl.pizzayolo.la">
        <svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M17 8c0-2-2.2-3-5-3s-5 1-5 3 2 2.7 5 3c3 .3 5 1 5 3s-2.2 3-5 3-5-1-5-3"/></svg>
        <span class="t">P&amp;L</span></a>
    </div>
  </div>

  <footer>
    EKKALAK HOSPITALITY CREATORS · VIENTIANE<br>
    v3
  </footer>
</div>

<script>
'use strict';
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
